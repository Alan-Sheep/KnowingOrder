# 知序 · Nginx 站点配置
#
# 用法：
#   cp nginx-rag-qa.conf /etc/nginx/conf.d/rag-qa.conf
#   nginx -t && systemctl reload nginx
#
# 部署形态：Nginx 同域托管前端静态产物 + 反代 /api 到本机 8080。
# 前端所有请求都是相对路径 /api/...，因此不需要 CORS，也不需要构建期环境变量。

server {
    # 未备案时只能用非标端口；完成 ICP 备案后可改成 80 并另开 443。
    listen 8090;
    server_name _;

    root /var/www/rag-qa;
    index index.html;

    # 后端 multipart 上限 2MB，留一倍余量
    client_max_body_size 4m;
    client_body_timeout 30s;

    # 不暴露 Nginx 版本
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # 注意：Nginx 的 add_header 不做继承——只要 location 内出现任意 add_header，
    # server 级的全部 add_header 都会失效。下面两个 location 自带 Cache-Control，
    # 因此必须把三条安全头原样重复一遍，否则首页与静态资源上的防护会静默丢失。

    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        access_log off;
    }

    # 首页不缓存，避免发版后用户拿到旧 HTML 指向已删除的 assets
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 问答链路 30s、通用 chat 105s，留足余量
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 上传走同一前缀，关闭请求缓冲以免大文件落到磁盘
        proxy_request_buffering off;
    }

    # SPA 路由回退：刷新 /enterprise 之类的深链接不会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/rag-qa.access.log;
    error_log  /var/log/nginx/rag-qa.error.log warn;
}
